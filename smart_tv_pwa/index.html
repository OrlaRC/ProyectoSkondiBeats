<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://*.supabase.co https://*.vercel.app; media-src 'self' https://*.supabase.co; img-src 'self' https://*.supabase.co data:; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B0B0B">
  <title>SkonditBeats TV</title>
  <link rel="stylesheet" href="css/tv.css">
</head>
<body>
  <video id="bg-video" muted loop playsinline autoplay preload="auto" data-src=""></video>
  <div id="bg-overlay"></div>
  <div id="app">
    <header id="header">
      <div class="logo">SkonditBeats</div>
      <div id="status-info">
        <button id="sync-toggle" class="sync-btn on">Sync: ON</button>
        <span id="date"></span>
        <span id="clock">--:--</span>
        <span id="connection-status" class="status-dot disconnected"></span>
      </div>
    </header>
    <main id="main-content">
      <aside id="sidebar">
        <nav>
          <button class="nav-item active" data-view="library">Biblioteca</button>
          <button class="nav-item" data-view="player">Reproductor</button>
        </nav>
      </aside>
      <section id="content">
        <div id="library-view">
          <div id="library-carousel"></div>
          <p id="library-count">Tienes 0 beats</p>
        </div>
        <div id="player-view" class="hidden">
          <div id="player-topbar">
            <button id="btn-back" class="back-btn">← Volver</button>
          </div>
          <div id="player-body">
            <div id="album-art">
              <img id="album-img" src="" alt="Portada">
              <div id="album-fallback" class="hidden"></div>
            </div>
            <div id="player-info">
              <h1 id="player-title">Selecciona un beat</h1>
              <p id="player-details"></p>
              <div id="playback-controls">
                <button class="control-btn" id="btn-prev">⏮</button>
                <button class="control-btn primary" id="btn-toggle"><span id="playback-icon">▶</span></button>
                <button class="control-btn" id="btn-next">⏭</button>
              </div>
              <div id="progress-bar"><div id="progress-fill"></div></div>
              <p id="player-time">0:00 / 0:00</p>
              <p id="playback-status" class="paused">PAUSADO</p>
              <p class="hint"><kbd>Flechas</kbd> mover · <kbd>Enter</kbd> reproducir · <kbd>Espacio</kbd> play/pausa · <kbd>N</kbd> siguiente · <kbd>V</kbd> cambiar vista · <kbd>S</kbd> sync · <kbd>Esc</kbd> volver</p>
            </div>
          </div>
        </div>
      </section>
    </main>
    <div id="mini-player" class="hidden">
      <div class="mini-info">
        <span id="mini-title">—</span>
        <span id="mini-time">0:00</span>
      </div>
      <div id="mini-progress"><div id="mini-fill"></div></div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dpad.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }
  </script>
</body>
</html>
