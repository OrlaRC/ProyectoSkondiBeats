name: skondit_phone
description: SkonditBeats Phone - BLE receiver + beat player + Supabase catalog
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.0
  permission_handler: ^11.3.1
  provider: ^6.1.2
  http: ^1.2.1
  audioplayers: ^6.0.0
  flutter_bluetooth_serial: ^0.4.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
